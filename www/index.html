<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>抚育调查</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; align-items: center; justify-content: center;
      background: #24543b; color: #fff;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .box { text-align: center; padding: 24px; }
    .mark {
      display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 16px;
      border: 1px solid #ffffff55; border-radius: 18px; background: #ffffff14;
      font-size: 30px; font-weight: 700;
    }
    strong { display: block; font-size: 21px; letter-spacing: .04em; }
    span { display: block; margin-top: 8px; color: #ffffffa8; font-size: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">林</div>
    <strong>抚育调查</strong>
    <span id="hint">正在连接服务器…</span>
  </div>
  <script>
    // 远程 URL 壳：页面本体在服务端，APK 只在首次安装时打包这一页
    setTimeout(function () {
      document.getElementById('hint').textContent = '网络不可用，请检查连接后重新打开';
    }, 12000);
  </script>
</body>
</html>
